[package]
name = "vuln-scanner"
version = "8.0.0"
edition = "2021"
authors = ["5n4vc4smh8-pixel"]
description = "Scanner de vulnerabilidades web de alta precisão, escrito em Rust, com Threat Intelligence e painel web Enterprise"
license = "AGPL-3.0-or-later"
repository = "https://github.com/5n4vc4smh8-pixel/vuln-scanner"
keywords = ["security", "vulnerability", "scanner", "web", "rust"]
categories = ["command-line-utilities"]

[dependencies]
# Core HTTP
reqwest = { version = "0.11", features = ["json", "stream", "cookies", "socks"] }
tokio = { version = "1.0", features = ["full"] }

# Parsing e serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI e logs
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.10"
log = "0.4"

# Segurança e utilidades
sha2 = "0.10"
url = "2.3"
chrono = { version = "0.4", features = ["serde"] }

# Processamento paralelo seguro
rayon = "1.7"

# HTML sanitization
ammonia = "3.3"

# Encoding de URL (necessário pela engine v6.2)
percent-encoding = "2.3.2"

# Web Enterprise (v7)
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
jsonwebtoken = "9.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
