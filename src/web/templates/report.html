<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Relatório - VulnScanner</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a2a3a;
            padding-bottom: 15px;
        }
        .header h1 { color: #00d4ff; }
        .btn {
            padding: 8px 20px;
            background: #1a2a3a;
            color: #e0e0e0;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #2a3a4a;
        }
        .btn:hover { background: #2a3a4a; }
        .btn-print {
            background: #00d4ff;
            color: #0a0e17;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        .relatorio {
            background: #111927;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #1a2a3a;
            margin-top: 20px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }
        .relatorio h1 { color: #00d4ff; }
        .relatorio h2 { color: #7b2ffc; }
        .relatorio h3 { color: #aabbcc; }
        .relatorio table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        .relatorio th {
            background: #1a2a3a;
            color: #00d4ff;
            padding: 8px 12px;
            text-align: left;
        }
        .relatorio td {
            padding: 8px 12px;
            border-bottom: 1px solid #1a2a3a;
        }
        .relatorio code {
            background: #0d1520;
            padding: 2px 6px;
            border-radius: 4px;
            color: #00d4ff;
        }
        .relatorio hr {
            border: 1px solid #1a2a3a;
            margin: 20px 0;
        }
        .relatorio strong {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📄 Relatório</h1>
        <div>
            <a href="/" class="btn">← Voltar</a>
            <button onclick="window.print()" class="btn-print">🖨️ Imprimir</button>
        </div>
    </div>
    <div class="relatorio">{{ conteudo }}</div>
</body>
</html>
